<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/videos/splash.mp4"
      as="video"
      type="video/mp4"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
      rel="stylesheet"
      crossorigin
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#841317" />

    <!-- iOS: 홈 화면에 추가했을 때 독립 앱처럼 실행되도록 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Viner" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.webp" />

    <title>wine-app-vite</title>
    <script>
      (() => {
        const recoveryKey = 'viner-app-shell-recovery-v1'
        let isRecovering = false

        const recoverAppShell = async () => {
          const root = document.querySelector('#root')
          if (isRecovering || root?.childElementCount || sessionStorage.getItem(recoveryKey)) {
            return
          }

          isRecovering = true
          sessionStorage.setItem(recoveryKey, '1')

          try {
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations()
              await Promise.allSettled(
                registrations.map((registration) => registration.unregister()),
              )
            }
          } catch {
            // Continue with a network reload even if the browser blocks SW access.
          }

          try {
            if ('caches' in window) {
              const cacheNames = await caches.keys()
              await Promise.allSettled(
                cacheNames
                  .filter((cacheName) => cacheName.startsWith('workbox-precache'))
                  .map((cacheName) => caches.delete(cacheName)),
              )
            }
          } catch {
            // Cache Storage can be unavailable in restricted browser modes.
          }

          const recoveryUrl = new URL(window.location.href)
          recoveryUrl.searchParams.set('app-recovery', Date.now().toString())
          window.location.replace(recoveryUrl)
        }

        window.addEventListener(
          'error',
          (event) => {
            if (event.target instanceof HTMLScriptElement && event.target.type === 'module') {
              void recoverAppShell()
            }
          },
          true,
        )

        window.setTimeout(() => void recoverAppShell(), 2500)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
